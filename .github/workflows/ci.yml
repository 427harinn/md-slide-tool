name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install python-pptx Pillow

      - name: Run root tests
        run: npm test

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      - name: Build render test image
        run: docker build --tag md-slide-tool-m2-test .

      - name: Run render and docx regression
        run: docker run --rm --volume "$PWD:/work" --workdir /work md-slide-tool-m2-test bash tests/m2-render-regression.sh
